<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">

    <div class="text-center mb-8">
      <span class="text-4xl">💡</span>
      <h1 class="text-xl font-bold text-gray-800 mt-2">{{ title }}</h1>
      <p class="text-sm text-gray-500">Admin access</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
        Incorrect password. Try again.
      </div>
      {% endif %}

      <form method="post" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" autofocus required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <button type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center mt-6">
      <a href="/" class="text-sm text-gray-400 hover:text-gray-600">← Back to suggestions</a>
    </p>
  </div>
</body>
</html>
