<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ title }}</title>
  <script>if (localStorage.theme === 'dark') document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html.dark body { background-color: #111827; }
    html.dark .bg-white { background-color: #1f2937 !important; }
    html.dark .border-gray-200 { border-color: #374151 !important; }
    html.dark .text-gray-800 { color: #f3f4f6 !important; }
    html.dark .text-gray-700 { color: #e5e7eb !important; }
    html.dark .text-gray-500 { color: #9ca3af !important; }
    html.dark .text-gray-400 { color: #6b7280 !important; }
    html.dark input {
      background-color: #374151 !important; border-color: #4b5563 !important; color: #f3f4f6 !important;
    }
    html.dark .bg-red-50 { background-color: rgba(127,29,29,0.3) !important; }
    html.dark .border-red-200 { border-color: #b91c1c !important; }
    html.dark .text-red-600 { color: #fca5a5 !important; }
    .bulb-off { display: block; }
    .bulb-on  { display: none;  }
    html.dark .bulb-off { display: none;  }
    html.dark .bulb-on  { display: block; }
    html.dark .bulb-on { color: #facc15; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm px-4">

    <div class="text-center mb-8">
      <button onclick="toggleTheme()" title="Toggle dark mode" class="cursor-pointer hover:opacity-75 transition">
        <svg class="bulb-off h-10 w-10 mx-auto text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
        </svg>
        <svg class="bulb-on h-10 w-10 mx-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .75a8.25 8.25 0 00-4.135 15.39c.686.398 1.115 1.008 1.134 1.623a.75.75 0 00.577.706c.352.083.71.148 1.074.195.323.041.6-.218.6-.544v-4.661a6.714 6.714 0 01-.937-.171.75.75 0 11.374-1.453 5.261 5.261 0 002.5 0 .75.75 0 11.373 1.453 6.679 6.679 0 01-.937.171v4.661c0 .326.277.585.6.544.364-.047.722-.112 1.074-.195a.75.75 0 00.577-.706c.02-.615.448-1.225 1.134-1.623A8.25 8.25 0 0012 .75z" />
          <path fill-rule="evenodd" d="M9.013 19.9a.75.75 0 01.877-.597 11.319 11.319 0 004.22 0 .75.75 0 11.28 1.473 12.819 12.819 0 01-4.78 0 .75.75 0 01-.597-.876zM9.754 22.344a.75.75 0 01.824-.668 13.682 13.682 0 002.844 0 .75.75 0 11.156 1.492 15.156 15.156 0 01-3.156 0 .75.75 0 01-.668-.824z" clip-rule="evenodd" />
        </svg>
      </button>
      <h1 class="text-xl font-bold text-gray-800 mt-2">{{ title }}</h1>
      <p class="text-sm text-gray-500">Admin access</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
        Incorrect password. Try again.
      </div>
      {% endif %}

      <form method="post" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" autofocus required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <button type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center mt-6">
      <a href="/" class="text-sm text-gray-400 hover:text-gray-600">← Back to suggestions</a>
    </p>
  </div>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark')
      localStorage.theme = isDark ? 'dark' : 'light'
    }
  </script>
</body>
</html>
