<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <script>if (localStorage.theme === 'dark') document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Light mode palette ── */
    body                                    { background-color: #FDF6EE; }
    .bg-white                               { background-color: #FFFAF4!important; }
    .bg-gray-50                             { background-color: #F5E8D0!important; }
    .border-gray-200                        { border-color: #E8D5B8!important; }
    .border-gray-300                        { border-color: #D4B896!important; }
    .text-gray-800                         { color: #2C1A0E!important; }
    .text-gray-700                         { color: #3D2B1F!important; }
    .text-gray-600                         { color: #5A3D2B!important; }
    .text-gray-500                         { color: #8B6548!important; }
    .text-gray-400                         { color: #B08060!important; }
    .text-gray-300                         { color: #C8A880!important; }
    .divide-gray-100 > * + *               { border-color: #E8D5B8!important; }
    input, textarea, select                 {
      background-color: #FFF8F0!important; border-color: #D4B896!important; color: #2C1A0E!important;
    }
    input::placeholder, textarea::placeholder { color: #B08060!important; }
    .hover\:bg-gray-50:hover               { background-color: rgba(255,69,0,.07)!important; }
    .hover\:bg-gray-200:hover              { background-color: rgba(255,69,0,.12)!important; }
    .bg-gray-100                           { background-color: #F0DEC8!important; color: #2C1A0E!important; }
    .bg-blue-100                           { background-color: rgba(255,111,97,.18)!important; }
    .text-blue-700                        { color: #C0392B!important; }
    .bg-yellow-100                         { background-color: rgba(218,165,32,.18)!important; }
    .text-yellow-700                      { color: #8B6914!important; }

    /* ── Dark mode palette ── */
    html.dark body                          { background-color: #1C1C1C; }
    html.dark .bg-white                     { background-color: #242424!important; }
    html.dark .bg-gray-50                   { background-color: #2C2C2C!important; }
    html.dark .border-gray-200              { border-color: #3A3A3A!important; }
    html.dark .border-gray-300              { border-color: #3A3A3A!important; }
    html.dark .text-gray-800               { color: #F5E8D8!important; }
    html.dark .text-gray-700               { color: #EDD9C0!important; }
    html.dark .text-gray-600               { color: #D4C4A8!important; }
    html.dark .text-gray-500               { color: #A89070!important; }
    html.dark .text-gray-400               { color: #7A6550!important; }
    html.dark .text-gray-300               { color: #5A4535!important; }
    html.dark .divide-gray-100 > * + *     { border-color: #3A3A3A!important; }
    html.dark input, html.dark textarea, html.dark select {
      background-color: #2C2C2C!important; border-color: #3A3A3A!important; color: #F5E8D8!important;
    }
    html.dark input::placeholder, html.dark textarea::placeholder { color: #7A6550!important; }
    html.dark .hover\:bg-gray-50:hover     { background-color: rgba(255,69,0,.15)!important; }
    html.dark .hover\:bg-gray-200:hover    { background-color: rgba(255,69,0,.2)!important; }
    html.dark .bg-gray-100                 { background-color: #2C2C2C!important; color: #F5E8D8!important; }
    html.dark .bg-blue-100                 { background-color: rgba(255,111,97,.2)!important; }
    html.dark .text-blue-700              { color: #FF6F61!important; }
    html.dark .bg-yellow-100               { background-color: rgba(218,165,32,.2)!important; }
    html.dark .text-yellow-700            { color: #DAA520!important; }
    html.dark .bg-green-100                { background-color: rgba(6,78,59,.35)!important; }
    html.dark .text-green-700             { color: #6ee7b7!important; }
    html.dark .bg-red-50                   { background-color: rgba(127,29,29,.3)!important; }
    html.dark .border-red-200              { border-color: #b91c1c!important; }
    html.dark .text-red-600               { color: #fca5a5!important; }
    .bulb-off { display: block; }
    .bulb-on  { display: none;  }
    html.dark .bulb-off { display: none;  }
    html.dark .bulb-on  { display: block; color: #DAA520; }
  </style>
</head>
<body class="{% block body_class %}bg-gray-50 min-h-screen{% endblock %}">
  {% block body %}{% endblock %}
  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark')
      localStorage.theme = isDark ? 'dark' : 'light'
    }
  </script>
</body>
</html>
